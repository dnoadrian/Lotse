name: lotse

services:
  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    image: lotse-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LOTSE_DOMAIN: ${LOTSE_DOMAIN:?LOTSE_DOMAIN fehlt in .env}
      LOTSE_TLS: ${LOTSE_TLS:?LOTSE_TLS fehlt in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  backend:
    build:
      context: ./backend
    image: lotse-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      LOTSE_ENVIRONMENT: production
      LOTSE_PUBLIC_URL: https://${LOTSE_DOMAIN}
      LOTSE_DATABASE_URL: postgresql+psycopg://lotse:${POSTGRES_PASSWORD}@db:5432/lotse
      LOTSE_TRUSTED_PROXIES: "1"
      LOTSE_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    # backend braucht Internet (IMAP/Gmail) und die Datenbank; nach außen nur über Caddy erreichbar
    networks: [edge, internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Eigene CA für den Mailserver (falls nötig) einbinden und LOTSE_IMAP_CA_FILE=/certs/mail-ca.pem setzen:
    # volumes:
    #   - ./certs/mail-ca.pem:/certs/mail-ca.pem:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lotse
      POSTGRES_USER: lotse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotse -d lotse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

networks:
  edge: {}
  internal:
    internal: true  # Datenbank hat keinen Internetzugang und keine offenen Ports

volumes:
  caddy_data: {}
  caddy_config: {}
  db_data: {}
