name: lotse  # alter Projektname bleibt, damit bestehende Docker-Volumes (Daten) erhalten bleiben

services:
  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    image: quitly-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      QUITLY_DOMAIN: ${QUITLY_DOMAIN:?QUITLY_DOMAIN fehlt in .env}
      QUITLY_TLS: ${QUITLY_TLS:?QUITLY_TLS fehlt in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  backend:
    build:
      context: ./backend
    image: quitly-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      QUITLY_ENVIRONMENT: production
      QUITLY_PUBLIC_URL: https://${QUITLY_DOMAIN}
      QUITLY_DATABASE_URL: postgresql+psycopg://lotse:${POSTGRES_PASSWORD}@db:5432/lotse
      QUITLY_TRUSTED_PROXIES: "1"
      QUITLY_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    # backend braucht Internet (IMAP/Gmail) und die Datenbank; nach außen nur über Caddy erreichbar
    networks: [edge, internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Eigene CA für den Mailserver (falls nötig) einbinden und QUITLY_IMAP_CA_FILE=/certs/mail-ca.pem setzen:
    # volumes:
    #   - ./certs/mail-ca.pem:/certs/mail-ca.pem:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lotse
      POSTGRES_USER: lotse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotse -d lotse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

networks:
  edge: {}
  internal:
    internal: true  # Datenbank hat keinen Internetzugang und keine offenen Ports

volumes:
  caddy_data: {}
  caddy_config: {}
  db_data: {}
