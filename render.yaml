# Render Blueprint: legt Web-Dienst und PostgreSQL-Datenbank an.
# Render-Dashboard → New → Blueprint → dieses Repository wählen → Apply.
services:
  - type: web
    name: quitly
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: QUITLY_ENVIRONMENT
        value: production
      - key: QUITLY_COOKIE_SECURE
        value: "true"
      # Render-Proxy setzt X-Forwarded-For; der letzte Eintrag ist die Client-IP
      - key: QUITLY_TRUSTED_PROXIES
        value: "1"
      - key: QUITLY_DATABASE_URL
        fromDatabase:
          name: quitly-db
          property: connectionString
      # Zufallswerte, von Render erzeugt (base64, 256 Bit)
      - key: QUITLY_SECRET_KEY
        generateValue: true
      - key: QUITLY_ENCRYPTION_KEY
        generateValue: true
      # Jeder kann sich ein eigenes Konto anlegen ("false" = abschalten)
      - key: QUITLY_OPEN_REGISTRATION
        value: "true"
      # Optional: eigene Domain, sonst automatisch https://<name>.onrender.com
      - key: QUITLY_PUBLIC_URL
        sync: false

databases:
  - name: quitly-db
    plan: free
    region: frankfurt
    databaseName: quitly
    user: quitly
    # Kein Zugriff aus dem Internet, nur aus Render-Diensten
    ipAllowList: []
