# Nur für lokale Ende-zu-Ende-Tests mit dem Dovecot-Testserver (scripts/test-imap/start.sh).
# Aufruf: docker compose -f docker-compose.yml -f scripts/test-imap/compose.e2e.yml up -d
services:
  backend:
    extra_hosts:
      - "imap.quitly.test:host-gateway"
    environment:
      QUITLY_IMAP_ALLOWED_HOSTS: imap.quitly.test
      QUITLY_IMAP_ALLOWED_PORTS: "993,10993"
      QUITLY_IMAP_CA_FILE: /certs/test-ca.pem
    volumes:
      - /tmp/quitly-test-imap/ca.pem:/certs/test-ca.pem:ro
